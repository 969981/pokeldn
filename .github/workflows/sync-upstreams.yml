name: Sync upstream branches

# main follows Decryptu/pokeldn:main
# ew follows easyworld/pokeldn:main
# This workflow lives on the default branch (main), because only default-branch
# workflows receive GitHub Actions scheduled events.
# Poll both upstream main branches every five minutes; scheduled runs may be delayed.
on:
  schedule:
    - cron: '*/5 * * * *'
  # Bootstrap a sync immediately after this workflow's configuration is fixed.
  # GITHUB_TOKEN pushes created by this sync do not recursively trigger it.
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-upstreams.yml
  workflow_dispatch:
    inputs:
      target:
        description: 'Which local branch to sync'
        type: choice
        required: true
        default: both
        options:
          - both
          - main
          - ew
      overwrite_local:
        description: 'Allow replacing locally developed branch contents'
        type: boolean
        default: false
        required: true

permissions:
  contents: write

concurrency:
  group: dual-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Mirror each branch from its own upstream
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'both' }}
          OVERWRITE_LOCAL: ${{ inputs.overwrite_local || 'false' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Preserve local CI infrastructure across upstream snapshot updates.
          # ew intentionally stays an exact source snapshot.
          workflow_backup="$RUNNER_TEMP/pokeldn-ci"
          mkdir -p "$workflow_backup"
          for file in sync-upstreams.yml auto-build.yml auto-release.yml research-integrate.yml research-build.yml; do
            if [[ -f ".github/workflows/$file" ]]; then
              cp ".github/workflows/$file" "$workflow_backup/$file"
            fi
          done

          git remote add decryptu https://github.com/Decryptu/pokeldn.git
          git remote add easyworld https://github.com/easyworld/pokeldn.git
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/ew:refs/remotes/origin/ew
          git fetch --no-tags decryptu \
            +refs/heads/main:refs/remotes/decryptu/main
          git fetch --no-tags easyworld \
            +refs/heads/main:refs/remotes/easyworld/main

          sync_branch() {
            local target="$1" source_remote="$2" source_repo="$3"
            local source_ref="refs/remotes/$source_remote/main"
            local subject source_sha

            git checkout --force -B "$target" "refs/remotes/origin/$target"
            subject="$(git log -1 --format=%s)"

            # Fail closed if there is unmirrored local work outside the CI
            # files we deliberately preserve below. Commit subject prefixes
            # (e.g. fix(ci) vs chore(ci)) are not a reliable safety check.
            if [[ "$OVERWRITE_LOCAL" != 'true' ]]; then
              local last_sync_sha changed_file
              last_sync_sha="$(git log -1 --format=%H --grep="chore(sync): $target from " || true)"
              if [[ -z "$last_sync_sha" ]]; then
                echo "::error::No previous $target mirror commit found; refusing automatic overwrite."
                return 1
              fi
              while IFS= read -r changed_file; do
                [[ -z "$changed_file" ]] && continue
                if [[ "$target" == 'main' ]]; then
                  case "$changed_file" in
                    .github/workflows/sync-upstreams.yml|.github/workflows/auto-build.yml|.github/workflows/auto-release.yml|.github/workflows/research-integrate.yml|.github/workflows/research-build.yml)
                      continue
                      ;;
                  esac
                fi
                echo "::error::Refusing to overwrite local changes on $target: $changed_file (since $last_sync_sha). Review or explicitly set overwrite_local=true in a manual run."
                return 1
              done < <(git diff --name-only "$last_sync_sha" HEAD)
            fi

            source_sha="$(git rev-parse "$source_ref")"
            # Keep all existing workflow files: the Actions GITHUB_TOKEN has
            # contents:write but cannot change workflows without workflows permission.
            # Excluding them also keeps project-specific CI definitions stable.
            git restore --source="$source_ref" --staged --worktree -- :/ ':(exclude).github/workflows/**'
            if [[ "$target" == 'main' ]]; then
              mkdir -p .github/workflows
              for file in sync-upstreams.yml auto-build.yml auto-release.yml research-integrate.yml research-build.yml; do
                if [[ -f "$workflow_backup/$file" ]]; then
                  cp "$workflow_backup/$file" ".github/workflows/$file"
                fi
              done
            fi
            git add -A

            if git diff --cached --quiet; then
              echo "$target is already in sync with $source_repo:main ($source_sha)"
              return
            fi

            git commit -m "chore(sync): $target from $source_repo@$source_sha"
            git push origin "HEAD:refs/heads/$target"
            echo "Synchronized $target from $source_repo:main ($source_sha)"
          }

          if [[ "$REQUESTED_TARGET" == 'both' || "$REQUESTED_TARGET" == 'main' ]]; then
            sync_branch main decryptu Decryptu/pokeldn
          fi
          if [[ "$REQUESTED_TARGET" == 'both' || "$REQUESTED_TARGET" == 'ew' ]]; then
            sync_branch ew easyworld easyworld/pokeldn
          fi
