name: Build research branch

# Manual/user edits to research build directly. GITHUB_TOKEN pushes from the
# integration workflow do not retrigger push workflows; integration explicitly
# calls the shared auto-build workflow after promoting the tested candidate.
on:
  push:
    branches: [research]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-branch-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.ref == 'refs/heads/research' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            gui/requirements.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r requirements.txt pytest==9.1.1 pytest-xdist==3.8.0 esptool==5.4.0 "flet[desktop]==1.0.2"
      - run: dotnet build -c Release services/pkhex -warnaserror
      - run: python -m pytest tests/ -q -W error -n auto --dist worksteal

  package:
    needs: test
    if: ${{ github.ref == 'refs/heads/research' && needs.test.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/auto-build.yml
    with:
      source_ref: ${{ github.sha }}
      source_branch: research
      release_tag: snapshot-research-${{ github.sha }}

  report-failure:
    needs: [test, package]
    if: ${{ always() && github.ref == 'refs/heads/research' && (needs.test.result == 'failure' || needs.package.result == 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Record the failing research commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        shell: bash
        run: |
          set -euo pipefail
          title="[research-build] Build failed"
          {
            echo "- Research commit: $SHA"
            echo "- Workflow run: https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID"
            echo "- Tests: $TEST_RESULT"
            echo "- Packaging: $PACKAGE_RESULT"
            echo
            echo "The research branch is not reset. Previous successful prereleases remain available."
          } > issue.txt
          existing="$(gh issue list --repo "$REPO" --state open --search '"[research-build] Build failed" in:title' --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body-file issue.txt
          else
            gh issue create --repo "$REPO" --title "$title" --body-file issue.txt
          fi
